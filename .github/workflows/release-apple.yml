name: Release Apple

# Apple signing credentials are not configured yet, so this is manual-only for now.
# When the APPLE_* secrets below exist, add:
#   push:
#     tags: ["v*"]
# to run it alongside the Android release on a tag.
on:
  workflow_dispatch:

concurrency:
  group: release-apple-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ios-archive:
    name: iOS Release archive and IPA
    # Kotlin 2.2.21 needs the macOS 26 SDK; macos-15/Xcode 16 fails to link the shared framework.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check version and tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            tools/release/check-version.sh "$REF_NAME"
          else
            tools/release/check-version.sh
          fi

      - name: Check Apple signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_IOS_PROVISION_BASE64: ${{ secrets.APPLE_IOS_PROVISION_BASE64 }}
        run: |
          missing=()
          for name in APPLE_TEAM_ID APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD \
                      APPLE_IOS_PROVISION_BASE64; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing Apple release secrets: ${missing[*]}"
            exit 1
          fi

      - name: Import signing certificate
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/apple-signing.keychain-db"
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

      - name: Install App Store provisioning profile
        env:
          APPLE_IOS_PROVISION_BASE64: ${{ secrets.APPLE_IOS_PROVISION_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$APPLE_IOS_PROVISION_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/cardv.mobileprovision"

      - name: Write local signing settings
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          printf 'DEVELOPMENT_TEAM = %s\n' "$APPLE_TEAM_ID" \
            > appleApp/Signing.local.xcconfig

      - name: Archive and export IPA
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: tools/apple/archive-ios.sh --export

      - uses: actions/upload-artifact@v4
        with:
          name: cardv-dashcam-ios
          path: build/apple/ios/export/*.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/apple/ios/export/*.ipa
          fail_on_unmatched_files: true

  macos-dmg:
    name: macOS notarized DMG
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check version and tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            tools/release/check-version.sh "$REF_NAME"
          else
            tools/release/check-version.sh
          fi

      - name: Check macOS signing and notary secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          missing=()
          for name in APPLE_TEAM_ID APPLE_DEVELOPER_ID_P12_BASE64 \
                      APPLE_DEVELOPER_ID_PASSWORD APPLE_NOTARY_KEY_P8_BASE64 \
                      APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing macOS release secrets: ${missing[*]}"
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/apple-developer-id.keychain-db"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$APPLE_DEVELOPER_ID_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

      - name: Write App Store Connect API key
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"

      - name: Build, notarize and staple DMG
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          ASC_API_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_NOTARY_KEY_ID }}.p8
          ASC_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ASC_API_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          if [[ -z "${MACOS_SIGN_IDENTITY:-}" ]]; then
            export MACOS_SIGN_IDENTITY="Developer ID Application"
          fi
          tools/apple/notarize-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cardv-dashcam-macos
          path: |
            build/apple/macos/CardvDashcam.dmg
            build/apple/macos/CardvDashcam.dmg.sha256
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/apple/macos/CardvDashcam.dmg
            build/apple/macos/CardvDashcam.dmg.sha256
          fail_on_unmatched_files: true
